<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/dynamsoft-document-viewer/ddv.js"></script>
    <link rel="stylesheet" href="/dynamsoft-document-viewer/ddv.css">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <title>Watercolor Painting Alignment Tool</title>
    <style>
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
      }

      h2 {
        color: #4CAF50;
        margin-bottom: 1rem;
      }

      .result {
        display: flex;
        gap: 2rem;
        margin-top: 2rem;
      }

      .original, .processed {
        flex-basis: 50%;
      }

      .original h3, .processed h3 {
        margin: 0.5rem 0;
        font-size: 1rem;
        color: #666;
      }

      #output, #photo {
        max-width: 100%;
        border: 1px solid #ddd;
        border-radius: 4px;
      }

      .fullscreen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .captureViewer, .perspectiveViewer {
        display: none;
      }

      button {
        padding: 0.75rem 1.5rem;
        margin: 0.5rem;
        border: none;
        border-radius: 6px;
        background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h2>🎨 Watercolor Painting Alignment Tool</h2>
      <div id="status">Loading OpenCV...</div>
      <div>
        <button id="loadReferenceBtn" disabled>
          🖼️ Upload Reference Photo
        </button>
        <button id="loadPaintingBtn" disabled>
          🎨 Upload Painting Photo
        </button>
        <button id="liveScanBtn" disabled>
          📷 Live Camera (Painting)
        </button>
        <button id="fullscreenCompareBtn" disabled>
          🔍 Fullscreen Compare
        </button>
      </div>
      <div>
        <input style="display:none;" type="file" id="referenceFile" onchange="loadReferenceFromFile();" accept=".jpg,.jpeg,.png,.bmp" />
        <input style="display:none;" type="file" id="paintingFile" onchange="loadPaintingFromFile();" accept=".jpg,.jpeg,.png,.bmp" />
      </div>
      <div>
        <label>
          Enable Canny Edge Detection:
          <input type="checkbox" id="enableCanny" checked/>
        </label>
      </div>
      <div class="result">
        <div class="original">
          <h3>🖼️ Reference Photo</h3>
          <div id="aspectRatio" style="font-size: 0.9rem; color: #888; margin-bottom: 0.5rem;"></div>
          <img id="photo"/>
          <img id="photoRaw" style="display:none;"/>
        </div>
        <div class="processed">
          <h3>🎨 Cropped Painting</h3>
          <img id="output"/>
        </div>
      </div>
      <div>
        <div id="captureViewer" class="fullscreen"></div>
        <div id="comparisonViewer" class="fullscreen" style="display: none;">
          <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000;">
            <img id="comparisonImage" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            <div id="comparisonHint" style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 1rem 2rem; border-radius: 8px; font-size: 1.1rem; pointer-events: none;">
              Hold to see reference • Release to see painting
            </div>
            <button id="exitComparisonBtn" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.9); color: #333; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 1rem; cursor: pointer; z-index: 10;">
              ✕ Exit
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript">
      let documentScanner;
      let captureViewer;
      let docManager;
      let doc;
      let detectHander;

      // State tracking for fullscreen comparison
      let hasReference = false;
      let hasPainting = false;
      let referenceImageData = null;
      let paintingImageData = null;

      initDDV();

      var Module = {
        // https://emscripten.org/docs/api_reference/module.html#Module.onRuntimeInitialized
        onRuntimeInitialized() {
          documentScanner = new DocumentScanner();
          document.getElementById('status').innerHTML = 'OpenCV.js is ready.';
          detectHandler = new OpenCVDocumentDetectHandler(documentScanner);
          Dynamsoft.DDV.setProcessingHandler("documentBoundariesDetect", detectHandler);
          // Enable buttons now that OpenCV is ready
          document.getElementById('loadReferenceBtn').disabled = false;
          document.getElementById('loadPaintingBtn').disabled = false;
          document.getElementById('liveScanBtn').disabled = false;
        }
      };

      async function initDDV(){
        Dynamsoft.DDV.Core.license = "DLS2eyJvcmdhbml6YXRpb25JRCI6IjIwMDAwMSJ9"; // Public trial license which is valid for 24 hours
        Dynamsoft.DDV.Core.engineResourcePath = "/dynamsoft-document-viewer/engine";// Lead to a folder containing the distributed WASM files
        await Dynamsoft.DDV.Core.loadWasm();
        await Dynamsoft.DDV.Core.init(); 
        docManager = Dynamsoft.DDV.documentManager;
        doc = docManager.createDocument({
          name: "doc"
        });
        captureViewer = new Dynamsoft.DDV.CaptureViewer({
          container: document.getElementById("captureViewer"),
          viewerConfig: {
            enableAutoCapture: false,
            enableAutoDetect: true
          }
        });
        const cameras = await captureViewer.getAllCameras();
        for (var i=0;i<cameras.length;i++)
        { 
            if(cameras[i].label.indexOf("OBS") != -1){ //for desktop testing
                captureViewer.selectCamera(cameras[i]);
                break;
            }
        }
        
        captureViewer.on("captured", async (e) => {
            // Stop video stream and hide capture viewer's container
            captureViewer.stop();
            document.getElementById("captureViewer").style.display = "none";
            const pageData =  captureViewer.currentDocument.getPageData(e.pageUid);
            const raw = await pageData.raw();
            // Set as painting photo
            let url = URL.createObjectURL(raw.data);
            await loadImage(document.getElementById("photoRaw"), url);
            // Auto-detect and crop (painting workflow)
            getCroppedImage();
            captureViewer.currentDocument.deleteAllPages();
        });
        captureViewer.openDocument(doc.uid);
      }

      document.getElementById("loadReferenceBtn").addEventListener("click",function(){
        document.getElementById("referenceFile").click();
      })

      document.getElementById("loadPaintingBtn").addEventListener("click",function(){
        document.getElementById("paintingFile").click();
      })

      document.getElementById("liveScanBtn").addEventListener("click",function(){
        if (captureViewer) {
          detectHandler.setScanOptions(getScanOptions());
          document.getElementById("captureViewer").style.display = "block";
          captureViewer.play({fill:true});
        }
      })

      // Fullscreen comparison mode
      document.getElementById("fullscreenCompareBtn").addEventListener("click", function(){
        const viewer = document.getElementById("comparisonViewer");
        const img = document.getElementById("comparisonImage");

        // Calculate the optimal display size based on viewport
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        // Load both images to get their dimensions
        const refImg = new Image();
        const paintImg = new Image();

        let loadCount = 0;

        function bothLoaded() {
          loadCount++;
          if (loadCount === 2) {
            // Use the painting's aspect ratio (it's the corrected one)
            const paintingAspect = paintImg.width / paintImg.height;

            // Calculate display size to fit viewport while maintaining aspect ratio
            let displayWidth = viewportWidth * 0.95;
            let displayHeight = displayWidth / paintingAspect;

            if (displayHeight > viewportHeight * 0.9) {
              displayHeight = viewportHeight * 0.9;
              displayWidth = displayHeight * paintingAspect;
            }

            // Set explicit size on the comparison image
            img.style.width = displayWidth + 'px';
            img.style.height = displayHeight + 'px';
            img.style.objectFit = 'fill'; // Force both to fill the same dimensions

            // Start with painting
            img.src = paintingImageData;

            // Show fullscreen
            viewer.style.display = "block";
          }
        }

        refImg.onload = bothLoaded;
        paintImg.onload = bothLoaded;
        refImg.src = referenceImageData;
        paintImg.src = paintingImageData;
      });

      // Exit comparison mode
      document.getElementById("exitComparisonBtn").addEventListener("click", function(e){
        e.stopPropagation();
        document.getElementById("comparisonViewer").style.display = "none";
      });

      // Prevent exit button from triggering comparison events
      document.getElementById("exitComparisonBtn").addEventListener("mousedown", function(e){
        e.stopPropagation();
      });

      document.getElementById("exitComparisonBtn").addEventListener("mouseup", function(e){
        e.stopPropagation();
      });

      document.getElementById("exitComparisonBtn").addEventListener("touchstart", function(e){
        e.stopPropagation();
      });

      document.getElementById("exitComparisonBtn").addEventListener("touchend", function(e){
        e.stopPropagation();
      });

      // ESC key to exit
      document.addEventListener("keydown", function(e){
        if (e.key === "Escape") {
          const viewer = document.getElementById("comparisonViewer");
          if (viewer.style.display === "block") {
            viewer.style.display = "none";
          }
        }
      });

      // Touch and mouse events for comparison
      const comparisonViewer = document.getElementById("comparisonViewer");
      const comparisonImage = document.getElementById("comparisonImage");

      function showReference() {
        comparisonImage.src = referenceImageData;
      }

      function showPainting() {
        comparisonImage.src = paintingImageData;
      }

      // Touch events
      comparisonViewer.addEventListener("touchstart", function(e){
        e.preventDefault();
        showReference();
      });

      comparisonViewer.addEventListener("touchend", function(e){
        e.preventDefault();
        showPainting();
      });

      // Mouse events
      comparisonViewer.addEventListener("mousedown", function(e){
        showReference();
      });

      comparisonViewer.addEventListener("mouseup", function(e){
        showPainting();
      });

      // Also handle when mouse leaves while holding
      comparisonViewer.addEventListener("mouseleave", function(e){
        showPainting();
      });

      function getCroppedImage(points){
        // If no points provided, detect them first with proper options
        if (!points) {
          points = documentScanner.detect(document.getElementById("photoRaw"), getScanOptions());
        }
        console.log("Detected corners:", points);
        let canvas = documentScanner.crop(document.getElementById("photoRaw"), points);
        const dataURL = canvas.toDataURL();
        document.getElementById("output").src = dataURL;

        // Store painting data and update state
        paintingImageData = dataURL;
        hasPainting = true;
        checkEnableComparisonButton();
      }

      function checkEnableComparisonButton() {
        const btn = document.getElementById("fullscreenCompareBtn");
        if (hasReference && hasPainting) {
          btn.disabled = false;
        } else {
          btn.disabled = true;
        }
      }

      async function loadImage(img,src) {
        return new Promise((resolve, reject) => {
          img.onload = function(){
            resolve();
          }
          img.src = src;
        })
      }

      function loadReferenceFromFile(){
        let fileInput = document.getElementById("referenceFile");
        let files = fileInput.files;
        if (files.length == 0) {
          return;
        }
        let file = files[0];
        fileReader = new FileReader();
        fileReader.onload = function(e){
          const img = new Image();
          img.onload = function() {
            // Calculate and display aspect ratio
            const width = img.width;
            const height = img.height;
            const ratio = width / height;
            const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
            const divisor = gcd(width, height);
            const ratioW = width / divisor;
            const ratioH = height / divisor;

            document.getElementById("aspectRatio").textContent =
              `Aspect Ratio: ${ratioW}:${ratioH} (${ratio.toFixed(2)}:1)`;

            // Display the reference photo
            document.getElementById("photo").src = e.target.result;

            // Store reference data and update state
            referenceImageData = e.target.result;
            hasReference = true;
            checkEnableComparisonButton();
          };
          img.src = e.target.result;
        };
        fileReader.onerror = function () {
          console.warn('oops, something went wrong.');
        };
        fileReader.readAsDataURL(file);
      }

      function loadPaintingFromFile(){
        let fileInput = document.getElementById("paintingFile");
        let files = fileInput.files;
        if (files.length == 0) {
          return;
        }
        let file = files[0];
        fileReader = new FileReader();
        fileReader.onload = async function(e){
          // Load the painting photo into the hidden raw element
          await loadImage(document.getElementById("photoRaw"), e.target.result);
          // Auto-detect and crop
          getCroppedImage();
        };
        fileReader.onerror = function () {
          console.warn('oops, something went wrong.');
        };
        fileReader.readAsDataURL(file);
      }

      function isMobile(){
        return "ontouchstart" in document.documentElement;
      }

      function getScanOptions(){
      let options = {};
      if(document.getElementById("enableCanny").checked){
        options.useCanny = true;
      }else{
        options.useCanny = false;
      }
      return options;
    }
    </script>
    <script type="module" src="/src/main.ts"></script>
    <script async src="/opencv.js" type="text/javascript"></script>
  </body>
</html>
