<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/dynamsoft-document-viewer/ddv.js"></script>
    <link rel="stylesheet" href="/dynamsoft-document-viewer/ddv.css">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <title>Watercolor Painting Alignment Tool</title>
    <style>
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
      }

      h2 {
        color: #4CAF50;
        margin-bottom: 1rem;
      }

      .result {
        display: flex;
        gap: 2rem;
        margin-top: 2rem;
      }

      .original, .processed {
        flex-basis: 50%;
      }

      .original h3, .processed h3 {
        margin: 0.5rem 0;
        font-size: 1rem;
        color: #666;
      }

      #output, #photo {
        max-width: 100%;
        border: 1px solid #ddd;
        border-radius: 4px;
      }

      .fullscreen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .captureViewer, .perspectiveViewer {
        display: none;
      }

      button {
        padding: 0.75rem 1.5rem;
        margin: 0.5rem;
        border: none;
        border-radius: 6px;
        background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h2>Reference Tool</h2>
      <div>
        <button id="loadReferenceBtn" disabled>
          🖼️ Upload Reference Photo
        </button>
        <button id="loadPaintingBtn" disabled>
          🎨 Upload Painting Photo
        </button>
        <button id="liveScanBtn" disabled>
          📷 Live Camera (Painting)
        </button>
        <button id="fullscreenCompareBtn" disabled>
          🔍 Fullscreen Compare
        </button>
      </div>
      <div>
        <input style="display:none;" type="file" id="referenceFile" onchange="loadReferenceFromFile();" accept=".jpg,.jpeg,.png,.bmp" />
        <input style="display:none;" type="file" id="paintingFile" onchange="loadPaintingFromFile();" accept=".jpg,.jpeg,.png,.bmp" />
      </div>
      <div>
        <label>
          Enable Canny Edge Detection:
          <input type="checkbox" id="enableCanny" checked/>
        </label>
      </div>
      <div class="result">
        <div class="original">
          <h3>🖼️ Reference Photo</h3>
          <div id="aspectRatio" style="font-size: 0.9rem; color: #888; margin-bottom: 0.5rem;"></div>
          <img id="photo"/>
          <img id="photoRaw" style="display:none;"/>
        </div>
        <div class="processed">
          <h3>🎨 Cropped Painting</h3>
          <img id="output"/>
        </div>
      </div>
      <div>
        <div id="captureViewer" class="fullscreen"></div>
        <div id="comparisonViewer" class="fullscreen" style="display: none;">
          <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000;">
            <img id="comparisonImage" style="max-width: 100%; max-height: 100%; object-fit: contain;">

            <!-- Toolbar -->
            <div id="comparisonToolbar" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 0.25rem; background: rgba(0,0,0,0.8); padding: 0.5rem; border-radius: 6px; z-index: 10;">
              <button id="fsUploadRefBtn" style="background: rgba(255,255,255,0.9); color: #333; border: none; padding: 0.4rem 0.7rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
                Upload Ref
              </button>
              <button id="fsUploadPaintingBtn" style="background: rgba(255,255,255,0.9); color: #333; border: none; padding: 0.4rem 0.7rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
                Upload Paint
              </button>
              <button id="fsLiveModeBtn" style="background: rgba(255,255,255,0.9); color: #333; border: none; padding: 0.4rem 0.7rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
                Live
              </button>
              <button id="fsAlignBtn" style="background: rgba(255,255,255,0.9); color: #333; border: none; padding: 0.4rem 0.7rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
                Align
              </button>
              <button id="fsExitBtn" style="background: rgba(255,255,255,0.9); color: #333; border: none; padding: 0.4rem 0.7rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
                Exit
              </button>
            </div>

            <!-- Alignment controls (hidden by default) -->
            <div id="alignmentControls" style="display: none; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 0.4rem 0.6rem; border-radius: 6px; z-index: 10; max-width: 90vw;">
              <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 0.4rem; flex: 1; min-width: 120px;">
                  <label style="color: white; font-size: 0.7rem; white-space: nowrap;">Rotate</label>
                  <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0" style="flex: 1;">
                  <span id="rotateValue" style="color: white; font-size: 0.65rem; min-width: 30px;">0°</span>
                </div>

                <div style="display: flex; align-items: center; gap: 0.4rem; flex: 1; min-width: 120px;">
                  <label style="color: white; font-size: 0.7rem; white-space: nowrap;">Opacity</label>
                  <input type="range" id="opacitySlider" min="0" max="1" step="0.01" value="0.5" style="flex: 1;">
                  <span id="opacityValue" style="color: white; font-size: 0.65rem; min-width: 30px;">50%</span>
                </div>

                <div style="color: white; font-size: 0.7rem; white-space: nowrap;">
                  Scale: <span id="scaleValue">100%</span>
                </div>

                <button id="resetAlignBtn" style="background: rgba(255,255,255,0.9); color: #333; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer;">
                  Reset
                </button>
                <button id="doneAlignBtn" style="background: rgba(76,175,80,0.9); color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer;">
                  Done
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript">
      let documentScanner;
      let captureViewer;
      let docManager;
      let doc;
      let detectHander;

      // State tracking for fullscreen comparison
      let hasReference = false;
      let hasPainting = false;
      let referenceImageData = null;
      let paintingImageData = null;

      // Alignment mode state
      let alignmentMode = false;
      let alignmentCanvas = null;
      let alignmentCtx = null;
      let paintingTransform = {
        scale: 1,
        rotation: 0,
        offsetX: 0,
        offsetY: 0,
        opacity: 0.5
      };
      let savedPaintingTransform = null;

      initDDV();

      var Module = {
        // https://emscripten.org/docs/api_reference/module.html#Module.onRuntimeInitialized
        onRuntimeInitialized() {
          documentScanner = new DocumentScanner();
          detectHandler = new OpenCVDocumentDetectHandler(documentScanner);
          Dynamsoft.DDV.setProcessingHandler("documentBoundariesDetect", detectHandler);
          // Enable buttons now that OpenCV is ready
          document.getElementById('loadReferenceBtn').disabled = false;
          document.getElementById('loadPaintingBtn').disabled = false;
          document.getElementById('liveScanBtn').disabled = false;
        }
      };

      async function initDDV(){
        Dynamsoft.DDV.Core.license = "DLS2eyJvcmdhbml6YXRpb25JRCI6IjIwMDAwMSJ9"; // Public trial license which is valid for 24 hours
        Dynamsoft.DDV.Core.engineResourcePath = "/dynamsoft-document-viewer/engine";// Lead to a folder containing the distributed WASM files
        await Dynamsoft.DDV.Core.loadWasm();
        await Dynamsoft.DDV.Core.init(); 
        docManager = Dynamsoft.DDV.documentManager;
        doc = docManager.createDocument({
          name: "doc"
        });
        captureViewer = new Dynamsoft.DDV.CaptureViewer({
          container: document.getElementById("captureViewer"),
          viewerConfig: {
            enableAutoCapture: false,
            enableAutoDetect: true
          }
        });
        const cameras = await captureViewer.getAllCameras();
        for (var i=0;i<cameras.length;i++)
        { 
            if(cameras[i].label.indexOf("OBS") != -1){ //for desktop testing
                captureViewer.selectCamera(cameras[i]);
                break;
            }
        }
        
        captureViewer.on("captured", async (e) => {
            // Stop video stream and hide capture viewer's container
            captureViewer.stop();
            document.getElementById("captureViewer").style.display = "none";
            const pageData =  captureViewer.currentDocument.getPageData(e.pageUid);
            const raw = await pageData.raw();
            // Set as painting photo
            let url = URL.createObjectURL(raw.data);
            await loadImage(document.getElementById("photoRaw"), url);
            // Auto-detect and crop (painting workflow)
            getCroppedImage();
            captureViewer.currentDocument.deleteAllPages();
        });
        captureViewer.openDocument(doc.uid);
      }

      document.getElementById("loadReferenceBtn").addEventListener("click",function(){
        document.getElementById("referenceFile").click();
      })

      document.getElementById("loadPaintingBtn").addEventListener("click",function(){
        document.getElementById("paintingFile").click();
      })

      document.getElementById("liveScanBtn").addEventListener("click",function(){
        if (captureViewer) {
          detectHandler.setScanOptions(getScanOptions());
          document.getElementById("captureViewer").style.display = "block";
          captureViewer.play({fill:true});
        }
      })

      // Enter fullscreen comparison mode
      function enterFullscreenComparison() {
        const viewer = document.getElementById("comparisonViewer");
        const img = document.getElementById("comparisonImage");

        // Load reference to get its dimensions
        const refImg = new Image();
        refImg.onload = function() {
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;

          // Calculate display size based on reference aspect ratio
          const aspectRatio = refImg.width / refImg.height;

          let displayWidth = viewportWidth * 0.95;
          let displayHeight = displayWidth / aspectRatio;

          // If too tall, constrain by height instead
          if (displayHeight > viewportHeight * 0.9) {
            displayHeight = viewportHeight * 0.9;
            displayWidth = displayHeight * aspectRatio;
          }

          // Set explicit size
          img.style.width = displayWidth + 'px';
          img.style.height = displayHeight + 'px';
          img.style.objectFit = 'contain';

          // Start with reference
          img.src = referenceImageData;

          // Show fullscreen
          viewer.style.display = "block";
        };
        refImg.src = referenceImageData;
      }

      // Auto-enter fullscreen if both images are loaded
      function checkAutoEnterFullscreen() {
        if (hasReference && hasPainting) {
          enterFullscreenComparison();
        }
      }

      // Fullscreen comparison mode button
      document.getElementById("fullscreenCompareBtn").addEventListener("click", function(){
        enterFullscreenComparison();
      });

      // Fullscreen toolbar buttons
      document.getElementById("fsUploadRefBtn").addEventListener("click", function(e){
        e.stopPropagation();
        document.getElementById("referenceFile").click();
      });

      document.getElementById("fsUploadPaintingBtn").addEventListener("click", function(e){
        e.stopPropagation();
        document.getElementById("paintingFile").click();
      });

      document.getElementById("fsLiveModeBtn").addEventListener("click", function(e){
        e.stopPropagation();
        // Close fullscreen comparison first
        document.getElementById("comparisonViewer").style.display = "none";
        // Open live camera mode
        if (captureViewer) {
          detectHandler.setScanOptions(getScanOptions());
          document.getElementById("captureViewer").style.display = "block";
          captureViewer.play({fill:true});
        }
      });

      document.getElementById("fsAlignBtn").addEventListener("click", function(e){
        e.stopPropagation();
        enterAlignmentMode();
      });

      document.getElementById("fsExitBtn").addEventListener("click", function(e){
        e.stopPropagation();
        document.getElementById("comparisonViewer").style.display = "none";
        exitAlignmentMode();
      });

      // Alignment mode functions
      function enterAlignmentMode() {
        alignmentMode = true;
        document.getElementById("alignmentControls").style.display = "block";

        // Restore saved transform values if they exist
        if (savedPaintingTransform) {
          // Load reference to convert ratios to absolute values
          const refImg = new Image();
          refImg.onload = function() {
            paintingTransform.scale = savedPaintingTransform.scale;
            paintingTransform.rotation = savedPaintingTransform.rotation;
            // Convert ratios back to absolute pixel offsets
            paintingTransform.offsetX = savedPaintingTransform.offsetXRatio * refImg.width;
            paintingTransform.offsetY = savedPaintingTransform.offsetYRatio * refImg.height;

            // Update displays
            document.getElementById("scaleValue").textContent = Math.round(savedPaintingTransform.scale * 100) + '%';
            document.getElementById("rotateSlider").value = savedPaintingTransform.rotation;
            document.getElementById("rotateValue").textContent = savedPaintingTransform.rotation + '°';

            console.log("Restored transform:", paintingTransform);
          };
          refImg.src = referenceImageData;
        }

        // Create overlay canvas if not exists
        if (!alignmentCanvas) {
          alignmentCanvas = document.createElement('canvas');
          alignmentCtx = alignmentCanvas.getContext('2d');
        }

        // Switch to overlay mode
        const img = document.getElementById("comparisonImage");
        img.style.display = 'none';

        const viewer = document.getElementById("comparisonViewer");
        const container = viewer.querySelector('div');

        // Calculate optimal display size (same as preview mode)
        const tempImg = new Image();
        tempImg.onload = function() {
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          const aspectRatio = tempImg.width / tempImg.height;

          let displayWidth = viewportWidth * 0.95;
          let displayHeight = displayWidth / aspectRatio;

          if (displayHeight > viewportHeight * 0.9) {
            displayHeight = viewportHeight * 0.9;
            displayWidth = displayHeight * aspectRatio;
          }

          // Set explicit size on canvas
          alignmentCanvas.style.width = displayWidth + 'px';
          alignmentCanvas.style.height = displayHeight + 'px';
          alignmentCanvas.style.objectFit = 'contain';

          container.insertBefore(alignmentCanvas, container.firstChild);
          renderAlignmentView();
        };
        tempImg.src = referenceImageData;

        // Enable drag to reposition
        setupDragHandlers();
      }

      function setupDragHandlers() {
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;
        let initialPinchDistance = 0;
        let initialScale = 1;

        // Calculate scale factor between display size and canvas resolution
        function getCanvasScale() {
          const displayWidth = parseFloat(alignmentCanvas.style.width);
          const canvasWidth = alignmentCanvas.width;
          return canvasWidth / displayWidth;
        }

        alignmentCanvas.addEventListener('mousedown', function(e) {
          isDragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          e.stopPropagation();
        });

        alignmentCanvas.addEventListener('mousemove', function(e) {
          if (isDragging) {
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            const scale = getCanvasScale();
            paintingTransform.offsetX += dx * scale;
            paintingTransform.offsetY += dy * scale;
            lastX = e.clientX;
            lastY = e.clientY;
            renderAlignmentView();
            e.stopPropagation();
          }
        });

        alignmentCanvas.addEventListener('mouseup', function(e) {
          isDragging = false;
          e.stopPropagation();
        });

        alignmentCanvas.addEventListener('mouseleave', function(e) {
          isDragging = false;
        });

        // Mouse wheel for zoom
        alignmentCanvas.addEventListener('wheel', function(e) {
          e.preventDefault();
          e.stopPropagation();

          const delta = -e.deltaY / 1000;
          paintingTransform.scale = Math.max(0.1, Math.min(3, paintingTransform.scale + delta));
          document.getElementById("scaleValue").textContent = Math.round(paintingTransform.scale * 100) + '%';
          renderAlignmentView();
        });

        // Touch events for drag and pinch
        alignmentCanvas.addEventListener('touchstart', function(e) {
          if (e.touches.length === 1) {
            // Single touch - drag
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            e.stopPropagation();
            e.preventDefault();
          } else if (e.touches.length === 2) {
            // Two touches - pinch to zoom
            isDragging = false;
            const dx = e.touches[1].clientX - e.touches[0].clientX;
            const dy = e.touches[1].clientY - e.touches[0].clientY;
            initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
            initialScale = paintingTransform.scale;
            e.stopPropagation();
            e.preventDefault();
          }
        });

        alignmentCanvas.addEventListener('touchmove', function(e) {
          if (e.touches.length === 1 && isDragging) {
            // Single touch drag
            const dx = e.touches[0].clientX - lastX;
            const dy = e.touches[0].clientY - lastY;
            const scale = getCanvasScale();
            paintingTransform.offsetX += dx * scale;
            paintingTransform.offsetY += dy * scale;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            renderAlignmentView();
            e.stopPropagation();
            e.preventDefault();
          } else if (e.touches.length === 2) {
            // Pinch zoom
            const dx = e.touches[1].clientX - e.touches[0].clientX;
            const dy = e.touches[1].clientY - e.touches[0].clientY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const scale = (distance / initialPinchDistance) * initialScale;
            paintingTransform.scale = Math.max(0.1, Math.min(3, scale));
            document.getElementById("scaleValue").textContent = Math.round(paintingTransform.scale * 100) + '%';
            renderAlignmentView();
            e.stopPropagation();
            e.preventDefault();
          }
        });

        alignmentCanvas.addEventListener('touchend', function(e) {
          if (e.touches.length < 2) {
            isDragging = false;
          }
          e.stopPropagation();
          e.preventDefault();
        });
      }

      function exitAlignmentMode() {
        if (!alignmentMode) return;
        alignmentMode = false;
        document.getElementById("alignmentControls").style.display = "none";

        // Save the transform settings normalized to reference image dimensions
        // This allows transforms to work consistently across different painting sizes
        const refImg = new Image();
        refImg.onload = function() {
          savedPaintingTransform = {
            scale: paintingTransform.scale,
            rotation: paintingTransform.rotation,
            // Store offsets as ratio of reference dimensions
            offsetXRatio: paintingTransform.offsetX / refImg.width,
            offsetYRatio: paintingTransform.offsetY / refImg.height
          };
          console.log("Saved transform:", savedPaintingTransform);
        };
        refImg.src = referenceImageData;

        // Remove canvas and show original image
        if (alignmentCanvas && alignmentCanvas.parentNode) {
          alignmentCanvas.parentNode.removeChild(alignmentCanvas);
        }
        document.getElementById("comparisonImage").style.display = 'block';

        // Reset opacity slider (but keep other values for next time)
        document.getElementById("opacitySlider").value = 0.5;
        paintingTransform.opacity = 0.5;
      }

      function renderAlignmentView() {
        const refImg = new Image();
        const paintImg = new Image();
        let loadCount = 0;

        function bothLoaded() {
          loadCount++;
          if (loadCount === 2) {
            // Use reference image's native resolution for canvas
            // This ensures we maintain full quality
            const canvasWidth = refImg.width;
            const canvasHeight = refImg.height;

            alignmentCanvas.width = canvasWidth;
            alignmentCanvas.height = canvasHeight;

            // Clear canvas
            alignmentCtx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Draw reference image at full size
            alignmentCtx.drawImage(refImg, 0, 0, canvasWidth, canvasHeight);

            // Save context state
            alignmentCtx.save();

            // Set painting opacity
            alignmentCtx.globalAlpha = paintingTransform.opacity;

            // Transform for painting - all transforms happen at canvas center
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;

            alignmentCtx.translate(centerX + paintingTransform.offsetX, centerY + paintingTransform.offsetY);
            alignmentCtx.rotate((paintingTransform.rotation * Math.PI) / 180);
            // Scale uniformly - maintains aspect ratio
            alignmentCtx.scale(paintingTransform.scale, paintingTransform.scale);

            // Draw painting at its natural size, centered
            // This preserves the painting's aspect ratio
            alignmentCtx.drawImage(paintImg, -paintImg.width / 2, -paintImg.height / 2, paintImg.width, paintImg.height);

            // Restore context
            alignmentCtx.restore();
          }
        }

        refImg.onload = bothLoaded;
        paintImg.onload = bothLoaded;
        refImg.src = referenceImageData;
        paintImg.src = paintingImageData;
      }

      // Alignment control event listeners
      document.getElementById("rotateSlider").addEventListener("input", function(e){
        paintingTransform.rotation = parseInt(e.target.value);
        document.getElementById("rotateValue").textContent = paintingTransform.rotation + '°';
        renderAlignmentView();
      });

      document.getElementById("opacitySlider").addEventListener("input", function(e){
        paintingTransform.opacity = parseFloat(e.target.value);
        document.getElementById("opacityValue").textContent = Math.round(paintingTransform.opacity * 100) + '%';
        renderAlignmentView();
      });

      document.getElementById("resetAlignBtn").addEventListener("click", function(e){
        e.stopPropagation();
        paintingTransform = {
          scale: 1,
          rotation: 0,
          offsetX: 0,
          offsetY: 0,
          opacity: 0.5
        };
        document.getElementById("scaleValue").textContent = '100%';
        document.getElementById("rotateSlider").value = 0;
        document.getElementById("rotateValue").textContent = '0°';
        document.getElementById("opacitySlider").value = 0.5;
        document.getElementById("opacityValue").textContent = '50%';

        // Clear saved transform
        savedPaintingTransform = null;

        renderAlignmentView();
      });

      document.getElementById("doneAlignBtn").addEventListener("click", function(e){
        e.stopPropagation();
        exitAlignmentMode();
      });

      // Prevent alignment controls from triggering comparison events
      const alignmentControls = document.getElementById("alignmentControls");
      alignmentControls.addEventListener("mousedown", function(e){
        e.stopPropagation();
      });

      alignmentControls.addEventListener("mouseup", function(e){
        e.stopPropagation();
      });

      alignmentControls.addEventListener("touchstart", function(e){
        e.stopPropagation();
      });

      alignmentControls.addEventListener("touchend", function(e){
        e.stopPropagation();
      });

      // Prevent toolbar from triggering comparison events
      const toolbar = document.getElementById("comparisonToolbar");
      toolbar.addEventListener("mousedown", function(e){
        e.stopPropagation();
      });

      toolbar.addEventListener("mouseup", function(e){
        e.stopPropagation();
      });

      toolbar.addEventListener("touchstart", function(e){
        e.stopPropagation();
      });

      toolbar.addEventListener("touchend", function(e){
        e.stopPropagation();
      });

      // ESC key to exit
      document.addEventListener("keydown", function(e){
        if (e.key === "Escape") {
          const viewer = document.getElementById("comparisonViewer");
          if (viewer.style.display === "block") {
            viewer.style.display = "none";
          }
        }
      });

      // Touch and mouse events for comparison
      const comparisonViewer = document.getElementById("comparisonViewer");
      const comparisonImage = document.getElementById("comparisonImage");

      function showReference() {
        comparisonImage.src = referenceImageData;
      }

      function showPainting() {
        // Apply transform dynamically if we have saved transform
        if (savedPaintingTransform && referenceImageData && paintingImageData) {
          // Generate transformed view on-the-fly
          const refImg = new Image();
          const paintImg = new Image();
          let loadCount = 0;

          function bothLoaded() {
            loadCount++;
            if (loadCount === 2) {
              // Create canvas sized to reference
              const canvas = document.createElement('canvas');
              canvas.width = refImg.width;
              canvas.height = refImg.height;
              const ctx = canvas.getContext('2d');

              // Apply transforms to painting
              ctx.save();
              const centerX = canvas.width / 2;
              const centerY = canvas.height / 2;

              // Convert saved ratios to absolute pixel offsets
              const offsetX = savedPaintingTransform.offsetXRatio * refImg.width;
              const offsetY = savedPaintingTransform.offsetYRatio * refImg.height;

              ctx.translate(centerX + offsetX, centerY + offsetY);
              ctx.rotate((savedPaintingTransform.rotation * Math.PI) / 180);
              ctx.scale(savedPaintingTransform.scale, savedPaintingTransform.scale);

              // Draw painting centered at natural size
              ctx.drawImage(paintImg, -paintImg.width / 2, -paintImg.height / 2, paintImg.width, paintImg.height);
              ctx.restore();

              // Display transformed painting
              comparisonImage.src = canvas.toDataURL();
            }
          }

          refImg.onload = bothLoaded;
          paintImg.onload = bothLoaded;
          refImg.src = referenceImageData;
          paintImg.src = paintingImageData;
        } else {
          // No transform, show original
          comparisonImage.src = paintingImageData;
        }
      }

      // Touch events - press to show painting, release to show reference
      comparisonViewer.addEventListener("touchstart", function(e){
        if (alignmentMode) return; // Don't swap in alignment mode
        e.preventDefault();
        showPainting();
      });

      comparisonViewer.addEventListener("touchend", function(e){
        if (alignmentMode) return; // Don't swap in alignment mode
        e.preventDefault();
        showReference();
      });

      // Mouse events - press to show painting, release to show reference
      comparisonViewer.addEventListener("mousedown", function(e){
        if (alignmentMode) return; // Don't swap in alignment mode
        showPainting();
      });

      comparisonViewer.addEventListener("mouseup", function(e){
        if (alignmentMode) return; // Don't swap in alignment mode
        showReference();
      });

      // Also handle when mouse leaves while holding
      comparisonViewer.addEventListener("mouseleave", function(e){
        if (alignmentMode) return; // Don't swap in alignment mode
        showReference();
      });

      function getCroppedImage(points){
        // If no points provided, detect them first with proper options
        if (!points) {
          points = documentScanner.detect(document.getElementById("photoRaw"), getScanOptions());
        }
        console.log("Detected corners:", points);
        let canvas = documentScanner.crop(document.getElementById("photoRaw"), points);
        const dataURL = canvas.toDataURL();
        document.getElementById("output").src = dataURL;

        // Store painting data and update state
        paintingImageData = dataURL;
        hasPainting = true;
        checkEnableComparisonButton();

        // Restore saved transform values to current transform if they exist
        if (savedPaintingTransform && hasReference) {
          const refImg = new Image();
          refImg.onload = function() {
            paintingTransform.scale = savedPaintingTransform.scale;
            paintingTransform.rotation = savedPaintingTransform.rotation;
            // Convert ratios back to absolute pixel offsets
            paintingTransform.offsetX = savedPaintingTransform.offsetXRatio * refImg.width;
            paintingTransform.offsetY = savedPaintingTransform.offsetYRatio * refImg.height;

            // Update displays to reflect saved values
            document.getElementById("scaleValue").textContent = Math.round(savedPaintingTransform.scale * 100) + '%';
            document.getElementById("rotateSlider").value = savedPaintingTransform.rotation;
            document.getElementById("rotateValue").textContent = savedPaintingTransform.rotation + '°';

            console.log("Applied saved transform to new painting:", paintingTransform);
          };
          refImg.src = referenceImageData;
        }

        // Auto-enter fullscreen if reference is already loaded
        checkAutoEnterFullscreen();
      }

      function checkEnableComparisonButton() {
        const btn = document.getElementById("fullscreenCompareBtn");
        if (hasReference && hasPainting) {
          btn.disabled = false;
        } else {
          btn.disabled = true;
        }
      }

      async function loadImage(img,src) {
        return new Promise((resolve, reject) => {
          img.onload = function(){
            resolve();
          }
          img.src = src;
        })
      }

      function loadReferenceFromFile(){
        let fileInput = document.getElementById("referenceFile");
        let files = fileInput.files;
        if (files.length == 0) {
          return;
        }
        let file = files[0];
        fileReader = new FileReader();
        fileReader.onload = function(e){
          const img = new Image();
          img.onload = function() {
            // Calculate and display aspect ratio
            const width = img.width;
            const height = img.height;
            const ratio = width / height;
            const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
            const divisor = gcd(width, height);
            const ratioW = width / divisor;
            const ratioH = height / divisor;

            document.getElementById("aspectRatio").textContent =
              `Aspect Ratio: ${ratioW}:${ratioH} (${ratio.toFixed(2)}:1)`;

            // Display the reference photo
            document.getElementById("photo").src = e.target.result;

            // Store reference data and update state
            referenceImageData = e.target.result;
            hasReference = true;
            checkEnableComparisonButton();
          };
          img.src = e.target.result;
        };
        fileReader.onerror = function () {
          console.warn('oops, something went wrong.');
        };
        fileReader.readAsDataURL(file);
      }

      function loadPaintingFromFile(){
        let fileInput = document.getElementById("paintingFile");
        let files = fileInput.files;
        if (files.length == 0) {
          return;
        }
        let file = files[0];
        fileReader = new FileReader();
        fileReader.onload = async function(e){
          // Load the painting photo into the hidden raw element
          await loadImage(document.getElementById("photoRaw"), e.target.result);
          // Auto-detect and crop
          getCroppedImage();
        };
        fileReader.onerror = function () {
          console.warn('oops, something went wrong.');
        };
        fileReader.readAsDataURL(file);
      }

      function isMobile(){
        return "ontouchstart" in document.documentElement;
      }

      function getScanOptions(){
      let options = {};
      if(document.getElementById("enableCanny").checked){
        options.useCanny = true;
      }else{
        options.useCanny = false;
      }
      return options;
    }
    </script>

    <script async src="/opencv.js" type="text/javascript"></script>
